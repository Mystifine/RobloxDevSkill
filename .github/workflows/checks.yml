name: checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lune and Selene (the versions pinned in rokit.toml)
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o lune.zip https://github.com/lune-org/lune/releases/download/v0.11.0/lune-0.11.0-linux-x86_64.zip
          curl -fsSL -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip
          unzip -o lune.zip -d "$HOME/bin"
          unzip -o selene.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/lune" "$HOME/bin/selene"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Specs
        run: lune run tests/run.luau
      - name: Lint
        run: selene scripts tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Codex handoff wrapper (against a fake CLI)
        run: node --test tests/codex/handoff.test.mjs
